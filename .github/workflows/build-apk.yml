name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/buildlog.txt
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            ERR=$(tail -c 60000 /tmp/buildlog.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error::$ERR"
            exit $CODE
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
